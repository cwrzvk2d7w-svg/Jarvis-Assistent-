
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(circle, #102c50, #030711 75%);
    color: #e5faff;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding: 25px 15px;
}

h1 {
    letter-spacing: 8px;
    color: #76edff;
}

.status {
    color: #64f7cb;
    font-size: 12px;
    letter-spacing: 3px;
}

.core {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid #61eaff;
    margin: 65px auto 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px #148dff66;
    position: relative;
    animation: glow 3s infinite;
}

.core:before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 2px dashed #64eaff;
    border-radius: 50%;
    animation: rotate 18s linear infinite;
}

.orb {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 30% 25%,
        white,
        #63eaff 25%,
        #0872cc 65%,
        #06142a
    );
    box-shadow: 0 0 40px #39dfff;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes glow {
    50% { box-shadow: 0 0 55px #148dffbb; }
}

button, input {
    border-radius: 13px;
    padding: 14px;
    margin: 5px;
    font-size: 16px;
}

button {
    background: #104b83;
    color: white;
    border: 1px solid #65eaff;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

input {
    width: 65%;
    max-width: 100%;
    background: #061326;
    color: white;
    border: 1px solid #4384aa;
}

.panel {
    background: #061326cc;
    border: 1px solid #28638a;
    border-radius: 15px;
    padding: 18px;
    margin-top: 25px;
    line-height: 1.5;
}

#antwort {
    min-height: 35px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.voice-info {
    color: #91c9df;
    font-size: 12px;
    margin-top: 12px;
}

@media (max-width: 500px) {
    .core {
        width: 190px;
        height: 190px;
        margin: 45px auto 30px;
    }

    input {
        width: 90%;
    }
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<div class="status" id="status">
    SYSTEM BEREIT
</div>

<div class="core" id="core">
    <div class="orb"></div>
</div>

<button type="button" id="sprechButton">
    🎙 Mit JARVIS sprechen
</button>

<button type="button" id="testButton">
    🔊 Stimme testen
</button>

<button type="button" id="stoppButton">
    Stimme aus
</button>

<div class="panel">

    <strong>JARVIS · ANTWORT</strong>

    <p id="antwort">
        Guten Tag. Ich bin JARVIS. Wie kann ich dir helfen?
    </p>

    <form id="chatForm">

        <input
            id="eingabe"
            type="text"
            placeholder="Schreibe eine Nachricht..."
            autocomplete="off"
            maxlength="2000"
        >

        <button id="sendenButton" type="submit">
            Senden
        </button>

    </form>

    <div class="voice-info" id="voiceInfo">
        Sprachsystem wird geladen ...
    </div>

</div>

<script>
'use strict';
// JARVIS App-System aktivieren
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
            .then(() => console.log("JARVIS App aktiviert"))
            .catch(error => console.error("App-Fehler:", error));
    });
}
const antwort = document.getElementById('antwort');
const status = document.getElementById('status');
const feld = document.getElementById('eingabe');
const sendenButton = document.getElementById('sendenButton');
const voiceInfo = document.getElementById('voiceInfo');

let recognition = null;
let ausgewaehlteStimme = null;

// Freisprechmodus
let freisprechenAktiv = false;
let warteAufBefehl = false;
let anfrageLaeuft = false;


/* =================================
   JARVIS SPRACHAUSGABE
   WEIBLICHE DEUTSCHE STIMME
================================= */

function stimmenLaden() {

    if (!('speechSynthesis' in window)) {
        voiceInfo.textContent =
            'Sprachausgabe wird nicht unterstützt.';
        return;
    }

    const voices = window.speechSynthesis.getVoices();

    const germanVoices = voices.filter(voice =>
        voice.lang.toLowerCase().startsWith('de')
    );

    if (germanVoices.length === 0) {
        voiceInfo.textContent =
            'Keine deutsche Stimme verfügbar.';
        return;
    }

    // Bevorzugte weiblich klingende Stimmen
    const preferred = germanVoices.find(voice =>
        /anna|marlene|vicki|petra|female|siri/i.test(voice.name)
    );

    ausgewaehlteStimme = preferred || germanVoices[0];

    voiceInfo.textContent =
        'Aktive Stimme: ' + ausgewaehlteStimme.name;
}

// Stimmen initial laden
if ('speechSynthesis' in window) {
    stimmenLaden();

    window.speechSynthesis.onvoiceschanged = stimmenLaden;
}


/* =================================
   JARVIS SPRICHT
================================= */


function stimme(text) {

    if (!('speechSynthesis' in window)) {
        antwort.textContent +=
            '\n\nSprachausgabe nicht verfügbar.';
        
        if (freisprechenAktiv) {
            setTimeout(mikrofonStarten, 1000);
        }
        return;
    }

    // Mikrofon während der Antwort pausieren
    if (recognition) {
        try {
            recognition.abort();
        } catch (_) {}
    }

    const synth = window.speechSynthesis;
    synth.cancel();

    const u = new SpeechSynthesisUtterance(text);

    u.lang = 'de-DE';
    u.rate = 0.92;
    u.pitch = 1.05;
    u.volume = 1;

    if (ausgewaehlteStimme) {
        u.voice = ausgewaehlteStimme;
    }

    u.onstart = () => {
        status.textContent = 'JARVIS SPRICHT';
    };

    u.onend = () => {
        status.textContent = 'SYSTEM BEREIT';

        if (freisprechenAktiv) {
            setTimeout(mikrofonStarten, 1000);
        }
    };

    u.onerror = () => {
        status.textContent = 'SYSTEM BEREIT';

        if (freisprechenAktiv) {
            setTimeout(mikrofonStarten, 1000);
        }
    };

    synth.speak(u);
}


/* =================================
   STIMME TESTEN
================================= */

document.getElementById('testButton')
    .addEventListener('click', () => {

        stimmenLaden();

        stimme(
            'Hallo. Ich bin JARVIS. Wie kann ich dir heute helfen?'
        );
    });


/* =================================
   KI-VERBINDUNG MIT LLAMA
================================= */

async function senden(e) {

    if (e && typeof e.preventDefault === 'function') {
        e.preventDefault();
    }

    const q = feld.value.trim();

    if (!q) {
        return;
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }

    feld.value = '';

    antwort.textContent = 'JARVIS denkt nach ...';
    status.textContent = 'KI VERARBEITET ANFRAGE';

    sendenButton.disabled = true;

    try {

        const response = await fetch('/api/chat', {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                message: q
            })
        });

        let daten;

        try {
            daten = await response.json();
        } catch (_) {
            throw new Error(
                'Der Server hat keine gültige Antwort geliefert.'
            );
        }

        if (!response.ok) {
            throw new Error(
                daten.error ||
                ('Serverfehler (' + response.status + ').')
            );
        }

        if (
            typeof daten.answer !== 'string' ||
            !daten.answer.trim()
        ) {
            throw new Error(
                'Der Server hat keine Antwort geliefert.'
            );
        }

        // Antwort gleichzeitig als Text anzeigen
        antwort.textContent = daten.answer;

        // Antwort akustisch ausgeben
        stimme(daten.answer);

    } catch (err) {

        console.error('JARVIS-Fehler:', err);

        antwort.textContent =
            'Fehler: ' +
            (err.message || 'Verbindung fehlgeschlagen.');

        status.textContent = 'VERBINDUNGSFEHLER';
    if (freisprechenAktiv) {
        setTimeout(() => {
            if (freisprechenAktiv && !anfrageLaeuft) {
                mikrofonStarten();
            }
        }, 1500);
    }
    } finally {

        sendenButton.disabled = false;

        if (status.textContent !== 'VERBINDUNGSFEHLER') {
            status.textContent = 'SYSTEM BEREIT';
        }
    }
}


/* =================================
   NACHRICHT ABSENDEN
================================= */

document.getElementById('chatForm')
    .addEventListener('submit', senden);


/* =================================
   SPRACHEINGABE
================================= */

/* =================================
   JARVIS FREIHAND-SPRACHMODUS
================================= */

let hoerTimer = null;

function mikrofonStarten() {
    if (!freisprechenAktiv || anfrageLaeuft) return;

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        antwort.textContent =
            "Spracherkennung wird nicht unterstützt. Bitte Safari verwenden.";
        freisprechenAktiv = false;
        return;
    }

    if (recognition) {
        try { recognition.abort(); } catch (_) {}
    }

    recognition = new Recognition();
    recognition.lang = "de-DE";
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

// Nach 10 Sekunden ohne Sprachbeginn neu versuchen
recognition.onspeechend = () => {
    console.log("Sprache beendet");
};
    recognition.interimResults = false;

    
recognition.onstart = () => {
    status.textContent = "JARVIS HÖRT ZU";

    clearTimeout(hoerTimer);

    hoerTimer = setTimeout(() => {
        if (freisprechenAktiv && !anfrageLaeuft) {
            try {
                recognition.abort();
            } catch (_) {}

            setTimeout(mikrofonStarten, 500);
        }
    }, 10000);
};


    recognition.onresult = async (event) => {
    const text = event.results[0][0].transcript.trim();

    if (!text) {
        return;
    }

    clearTimeout(hoerTimer);

    anfrageLaeuft = true;
    feld.value = text;

    try {
        await senden();
    } finally {
        anfrageLaeuft = false;
    }
};
    recognition.onerror = (event) => {
        console.log("Mikrofon:", event.error);
    };

    recognition.onend = () => {
        if (freisprechenAktiv && !anfrageLaeuft) {
            clearTimeout(hoerTimer);
            hoerTimer = setTimeout(mikrofonStarten, 1000);
        }
    };

    try {
        recognition.start();
    } catch (error) {
        console.log("Mikrofonstart:", error);
    }
}

document.getElementById("sprechButton")
    .addEventListener("click", () => {

        freisprechenAktiv = !freisprechenAktiv;

        if (freisprechenAktiv) {
            document.getElementById("sprechButton").textContent =
                "🔴 Freisprechen beenden";

            mikrofonStarten();
        } else {
            clearTimeout(hoerTimer);

            if (recognition) {
                try { recognition.abort(); } catch (_) {}
            }

            status.textContent = "SYSTEM BEREIT";

            document.getElementById("sprechButton").textContent =
                "🎙 Freisprechen starten";
        }
    });



/* =================================
   SPRACHAUSGABE STOPPEN
================================= */

document.getElementById('stoppButton')
    .addEventListener('click', () => {

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

        status.textContent = 'SYSTEM BEREIT';
    });

</script>

</body>
</html>
