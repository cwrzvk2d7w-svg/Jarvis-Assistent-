
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(circle, #102c50, #030711 75%);
    color: #e5faff;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding: 25px 15px;
}

h1 {
    letter-spacing: 8px;
    color: #76edff;
}

.status {
    color: #64f7cb;
    font-size: 12px;
    letter-spacing: 3px;
}

.core {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid #61eaff;
    margin: 65px auto 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px #148dff66;
    position: relative;
    animation: glow 3s infinite;
}

.core:before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 2px dashed #64eaff;
    border-radius: 50%;
    animation: rotate 18s linear infinite;
}

.orb {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 30% 25%,
        white,
        #63eaff 25%,
        #0872cc 65%,
        #06142a
    );
    box-shadow: 0 0 40px #39dfff;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes glow {
    50% { box-shadow: 0 0 55px #148dffbb; }
}

button, input {
    border-radius: 13px;
    padding: 14px;
    margin: 5px;
    font-size: 16px;
}

button {
    background: #104b83;
    color: white;
    border: 1px solid #65eaff;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

input {
    width: 65%;
    max-width: 100%;
    background: #061326;
    color: white;
    border: 1px solid #4384aa;
}

.panel {
    background: #061326cc;
    border: 1px solid #28638a;
    border-radius: 15px;
    padding: 18px;
    margin-top: 25px;
    line-height: 1.5;
}

#antwort {
    min-height: 35px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.voice-info {
    color: #91c9df;
    font-size: 12px;
    margin-top: 12px;
}

@media (max-width: 500px) {
    .core {
        width: 190px;
        height: 190px;
        margin: 45px auto 30px;
    }

    input {
        width: 90%;
    }
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<div class="status" id="status">
    SYSTEM BEREIT
</div>

<div class="core" id="core">
    <div class="orb"></div>
</div>

<button type="button" id="sprechButton">
    🎙 Mit JARVIS sprechen
</button>

<button type="button" id="testButton">
    🔊 Stimme testen
</button>

<button type="button" id="stoppButton">
    Stimme aus
</button>

<div class="panel">

    <strong>JARVIS · ANTWORT</strong>

    <p id="antwort">
        Guten Tag. Ich bin JARVIS. Wie kann ich dir helfen?
    </p>

    <form id="chatForm">

        <input
            id="eingabe"
            type="text"
            placeholder="Schreibe eine Nachricht..."
            autocomplete="off"
            maxlength="2000"
        >

        <button id="sendenButton" type="submit">
            Senden
        </button>

    </form>

    <div class="voice-info" id="voiceInfo">
        Sprachsystem wird geladen ...
    </div>

</div>

<script>
'use strict';

// ==========================================
// J.A.R.V.I.S. – RED CORE
// SPRACHSTEUERUNG UND KI-VERBINDUNG
// ==========================================

// HTML-Elemente
const antwort = document.getElementById('antwort');
const status = document.getElementById('status');
const feld = document.getElementById('eingabe');
const sendenButton = document.getElementById('sendenButton');
const voiceInfo = document.getElementById('voiceInfo');
const sprechButton = document.getElementById('sprechButton');
const connectionPill = document.getElementById('connectionPill');

// Systemvariablen
let recognition = null;
let ausgewaehlteStimme = null;
let freisprechenAktiv = false;
let anfrageLaeuft = false;
let sprichtGerade = false;
let neustartTimer = null;
let startLaeuft = false;
let recognitionGeneration = 0;


// ==========================================
// SERVICE WORKER
// ==========================================

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
            .then(() => console.log('JARVIS App aktiviert'))
            .catch(error => console.error('App-Fehler:', error));
    });
}


// ==========================================
// STATUSSTEUERUNG
// ==========================================

function setState(state, label) {
    document.body.dataset.state = state;
    status.textContent = label;
}


// ==========================================
// DEUTSCHE SPRACHAUSGABE
// ==========================================

function stimmenLaden() {

    if (!('speechSynthesis' in window)) {
        voiceInfo.textContent =
            'Sprachausgabe wird nicht unterstützt.';
        return;
    }

    const voices = speechSynthesis.getVoices();

    const german = voices.filter(v =>
        (v.lang || '').toLowerCase().startsWith('de')
    );

    if (!german.length) {
        voiceInfo.textContent =
            'Keine deutsche Stimme verfügbar.';
        return;
    }

    ausgewaehlteStimme =
        german.find(v =>
            /anna|marlene|vicki|petra|female|siri/i.test(v.name)
        ) || german[0];

    voiceInfo.textContent =
        'Aktive Stimme: ' + ausgewaehlteStimme.name;
}

if ('speechSynthesis' in window) {
    stimmenLaden();
    speechSynthesis.addEventListener?.(
        'voiceschanged',
        stimmenLaden
    );
}


// ==========================================
// MIKROFON UND NEUSTART
// ==========================================

function clearRestart() {

    if (neustartTimer !== null) {
        clearTimeout(neustartTimer);
        neustartTimer = null;
    }
}

function stopRecognition() {

    const old = recognition;

    recognition = null;
    startLaeuft = false;

    if (old) {
        old.onstart = null;
        old.onresult = null;
        old.onerror = null;
        old.onend = null;

        try {
            old.abort();
        } catch (_) {}
    }
}

function planListen() {

    clearRestart();

    if (
        !freisprechenAktiv ||
        anfrageLaeuft ||
        sprichtGerade ||
        recognition ||
        startLaeuft
    ) {
        return;
    }

    neustartTimer = setTimeout(() => {
        neustartTimer = null;
        startListening();
    }, 900);
}


// ==========================================
// JARVIS SPRICHT
// ==========================================

function speak(text) {

    return new Promise(resolve => {

        if (!('speechSynthesis' in window)) {
            voiceInfo.textContent =
                'Sprachausgabe nicht verfügbar.';
            resolve();
            return;
        }

        stopRecognition();
        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = 'de-DE';
        utterance.rate = 0.92;
        utterance.pitch = 1.05;
        utterance.volume = 1;

        if (ausgewaehlteStimme) {
            utterance.voice = ausgewaehlteStimme;
        }

        let done = false;

        const finish = () => {

            if (done) return;

            done = true;
            sprichtGerade = false;

            setState('idle', 'SYSTEM BEREIT');

            resolve();
        };

        utterance.onstart = () => {

            sprichtGerade = true;

            setState(
                'speaking',
                'JARVIS SPRICHT'
            );
        };

        utterance.onend = finish;
        utterance.onerror = finish;

        speechSynthesis.speak(utterance);
    });
}


// ==========================================
// VERBINDUNG MIT LLAMA AI
// ==========================================

async function askAI(text) {

    setState(
        'thinking',
        'JARVIS DENKT NACH'
    );

    antwort.textContent =
        'JARVIS denkt nach ...';

    connectionPill.textContent =
        'LLAMA AI · WORKING';

    try {

        const response = await fetch('/api/chat', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                message: text
            })
        });

        let data;

        try {
            data = await response.json();
        } catch (_) {
            throw new Error(
                'Der Server hat keine gültige Antwort geliefert.'
            );
        }

        if (!response.ok) {
            throw new Error(
                data.error ||
                `Serverfehler (${response.status}).`
            );
        }

        if (
            typeof data.answer !== 'string' ||
            !data.answer.trim()
        ) {
            throw new Error(
                'Llama hat keine Antwort geliefert.'
            );
        }

        connectionPill.textContent =
            'LLAMA AI · ONLINE';

        antwort.textContent = data.answer;

        await speak(data.answer);

    } catch (error) {

        console.error('JARVIS:', error);

        connectionPill.textContent =
            'LLAMA AI · CHECK';

        antwort.textContent =
            'Fehler: ' +
            (error.message ||
            'Verbindung fehlgeschlagen.');

        setState(
            'error',
            'VERBINDUNGSFEHLER'
        );
    }
}


// ==========================================
// NACHRICHT SENDEN
// ==========================================

async function sendMessage(text) {

    if (!text || anfrageLaeuft) return;

    anfrageLaeuft = true;

    clearRestart();
    sendenButton.disabled = true;

    stopRecognition();

    try {

        await askAI(text);

    } finally {

        anfrageLaeuft = false;
        sendenButton.disabled = false;

        if (freisprechenAktiv) {
            planListen();
        } else if (
            document.body.dataset.state !== 'error'
        ) {
            setState(
                'idle',
                'SYSTEM BEREIT'
            );
        }
    }
}


// ==========================================
// TEXT EINGEBEN UND SENDEN
// ==========================================

document.getElementById('chatForm')
    .addEventListener('submit', async event => {

        event.preventDefault();

        const text = feld.value.trim();

        if (!text || anfrageLaeuft) return;

        feld.value = '';

        await sendMessage(text);
    });


// ==========================================
// SPRACHERKENNUNG STARTEN
// ==========================================

function startListening() {

    if (
        !freisprechenAktiv ||
        anfrageLaeuft ||
        sprichtGerade ||
        recognition ||
        startLaeuft
    ) {
        return;
    }

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        antwort.textContent =
            'Spracherkennung wird von diesem Browser ' +
            'nicht unterstützt. Bitte Safari verwenden.';

        stopHandsFree();
        return;
    }

    startLaeuft = true;

    const instanceId = ++recognitionGeneration;

    const rec = new SpeechRecognition();

    recognition = rec;

    rec.lang = 'de-DE';
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => {

        startLaeuft = false;

        if (
            freisprechenAktiv &&
            recognition === rec
        ) {
            setState(
                'listening',
                'JARVIS HÖRT ZU'
            );
        }
    };

    rec.onresult = event => {

        if (
            !freisprechenAktiv ||
            anfrageLaeuft ||
            recognition !== rec
        ) {
            return;
        }

        const result =
            event.results[event.resultIndex];

        const transcript =
            result && result[0]
                ? result[0].transcript.trim()
                : '';

        if (!transcript) return;

        feld.value = transcript;

        sendMessage(transcript);
    };

    rec.onerror = event => {

        console.warn(
            'Spracherkennung:',
            event.error
        );

        if (
            event.error === 'not-allowed' ||
            event.error === 'service-not-allowed'
        ) {

            antwort.textContent =
                'Mikrofonzugriff verweigert. ' +
                'Bitte die Mikrofonberechtigung für Safari prüfen.';

            stopHandsFree();

        } else if (
            event.error === 'audio-capture'
        ) {

            antwort.textContent =
                'Das Mikrofon konnte nicht angesprochen werden.';
        }
    };

    rec.onend = () => {

        if (recognition === rec) {
            recognition = null;
        }

        startLaeuft = false;

        if (instanceId !== recognitionGeneration) {
            return;
        }

        if (
            freisprechenAktiv &&
            !anfrageLaeuft &&
            !sprichtGerade
        ) {

            setState(
                'idle',
                'SYSTEM BEREIT'
            );

            planListen();
        }
    };

    try {

        rec.start();

    } catch (error) {

        console.warn(
            'Mikrofonstart:',
            error
        );

        if (recognition === rec) {
            recognition = null;
        }

        startLaeuft = false;

        planListen();
    }
}


// ==========================================
// FREISPRECHMODUS
// ==========================================

function startHandsFree() {

    if (freisprechenAktiv) return;

    freisprechenAktiv = true;

    sprechButton.textContent =
        '🔴 Freisprechen beenden';

    sprechButton.classList.add('primary');

    antwort.textContent =
        'JARVIS ist bereit. Ich höre dir zu.';

    startListening();
}

function stopHandsFree() {

    freisprechenAktiv = false;

    clearRestart();

    recognitionGeneration++;

    stopRecognition();

    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
    }

    sprichtGerade = false;

    sprechButton.textContent =
        '🎙 Freisprechen starten';

    setState(
        'idle',
        'SYSTEM BEREIT'
    );
}

sprechButton.addEventListener('click', () => {

    if (freisprechenAktiv) {
        stopHandsFree();
    } else {
        startHandsFree();
    }
});


// ==========================================
// STIMME TESTEN
// ==========================================

document.getElementById('testButton')
    .addEventListener('click', async () => {

        clearRestart();

        await speak(
            'Hallo. Ich bin JARVIS. ' +
            'Wie kann ich dir heute helfen?'
        );

        if (freisprechenAktiv) {
            planListen();
        }
    });


// ==========================================
// SPRACHAUSGABE STOPPEN
// ==========================================

document.getElementById('stoppButton')
    .addEventListener('click', () => {

        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
        }

        sprichtGerade = false;

        setState(
            'idle',
            'SYSTEM BEREIT'
        );

        if (freisprechenAktiv) {
            planListen();
        }
    });


// ==========================================
// APP SICHTBARKEIT
// ==========================================

document.addEventListener(
    'visibilitychange',
    () => {

        if (document.hidden) {

            clearRestart();
            stopRecognition();

        } else if (
            freisprechenAktiv &&
            !anfrageLaeuft &&
            !sprichtGerade
        ) {

            planListen();
        }
    }
);


// ==========================================
// SYSTEMSTART
// ==========================================

setState(
    'idle',
    'SYSTEM BEREIT'
);

connectionPill.textContent =
    'LLAMA AI · READY';

console.log(
    'J.A.R.V.I.S. RED CORE erfolgreich gestartet.'
);
