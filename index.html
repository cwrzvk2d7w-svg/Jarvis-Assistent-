<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(circle, #102c50, #030711 75%);
    color: #e5faff;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding: 25px 15px;
}

h1 {
    letter-spacing: 8px;
    color: #76edff;
}

.status {
    color: #64f7cb;
    font-size: 12px;
    letter-spacing: 3px;
}

.core {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid #61eaff;
    margin: 65px auto 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px #148dff66;
    position: relative;
    animation: glow 3s infinite;
}

.core:before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 2px dashed #64eaff;
    border-radius: 50%;
    animation: rotate 18s linear infinite;
}

.orb {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 30% 25%,
        white,
        #63eaff 25%,
        #0872cc 65%,
        #06142a
    );
    box-shadow: 0 0 40px #39dfff;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

@keyframes glow {
    50% {
        box-shadow: 0 0 55px #148dffbb;
    }
}

button,
input {
    border-radius: 13px;
    padding: 14px;
    margin: 5px;
    font-size: 16px;
}

button {
    background: #104b83;
    color: white;
    border: 1px solid #65eaff;
}

button:disabled {
    opacity: 0.6;
}

input {
    width: 65%;
    max-width: 100%;
    background: #061326;
    color: white;
    border: 1px solid #4384aa;
}

.panel {
    background: #061326cc;
    border: 1px solid #28638a;
    border-radius: 15px;
    padding: 18px;
    margin-top: 25px;
    line-height: 1.5;
}

#antwort {
    min-height: 35px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

@media (max-width: 500px) {
    .core {
        width: 190px;
        height: 190px;
        margin: 45px auto 30px;
    }

    input {
        width: 90%;
    }
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<div class="status" id="status">
    SYSTEM BEREIT
</div>

<div class="core" id="core">
    <div class="orb"></div>
</div>

<button type="button" id="sprechButton">
    🎙 Mit JARVIS sprechen
</button>

<button type="button" id="stoppButton">
    Stimme aus
</button>

<div class="panel">

    <strong>JARVIS · ANTWORT</strong>

    <p id="antwort">
        Guten Abend. Ich bin JARVIS. Wie kann ich dir helfen?
    </p>

    <form id="chatForm">

        <input
            id="eingabe"
            placeholder="Schreibe eine Nachricht..."
            autocomplete="off"
            maxlength="2000"
        >

        <button id="sendenButton" type="submit">
            Senden
        </button>

    </form>

</div>

<script>
'use strict';

const antwort = document.getElementById('antwort');
const status = document.getElementById('status');
const feld = document.getElementById('eingabe');
const sendenButton = document.getElementById('sendenButton');


/* SPRACHAUSGABE */

function stimme(text) {

    if (!('speechSynthesis' in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);

    u.lang = 'de-DE';
    u.rate = 0.9;
    u.pitch = 0.8;

    window.speechSynthesis.speak(u);
}


/* KI-VERBINDUNG */

async function senden(e) {

    if (e && typeof e.preventDefault === 'function') {
        e.preventDefault();
    }

    const q = feld.value.trim();

    if (!q) {
        return;
    }

    feld.value = '';

    antwort.textContent = 'JARVIS denkt nach ...';
    status.textContent = 'KI VERARBEITET ANFRAGE';

    sendenButton.disabled = true;

    try {

        const response = await fetch('/api/chat', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                message: q
            })

        });

        let daten;

        try {
            daten = await response.json();
        } catch (_) {
            throw new Error(
                'Der Server hat keine gültige Antwort geliefert.'
            );
        }

        if (!response.ok) {
            throw new Error(
                daten.error ||
                ('Serverfehler (' + response.status + ').')
            );
        }

        if (
            typeof daten.answer !== 'string' ||
            !daten.answer.trim()
        ) {
            throw new Error(
                'Der Server hat keine Antwort geliefert.'
            );
        }

        antwort.textContent = daten.answer;

        stimme(daten.answer);

    } catch (err) {

        console.error(
            'JARVIS-Anfrage fehlgeschlagen:',
            err
        );

        antwort.textContent =
            'Fehler: ' +
            (
                err.message ||
                'Die Verbindung zur KI ist fehlgeschlagen.'
            );

    } finally {

        status.textContent = 'SYSTEM BEREIT';

        sendenButton.disabled = false;

    }
}


/* NACHRICHT ABSENDEN */

document
    .getElementById('chatForm')
    .addEventListener('submit', senden);


/* SPRACHEINGABE */

document
    .getElementById('sprechButton')
    .addEventListener('click', () => {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!Recognition) {

            antwort.textContent =
                'Spracherkennung wird in diesem Browser nicht unterstützt. Bitte nutze das Textfeld.';

            return;
        }

        const recognition = new Recognition();

        recognition.lang = 'de-DE';

        recognition.onstart = () => {
            status.textContent = 'ICH HÖRE ZU';
        };

        recognition.onresult = (event) => {

            feld.value = event.results[0][0].transcript;

            senden();

        };

        recognition.onerror = () => {

            status.textContent = 'SYSTEM BEREIT';

            antwort.textContent =
                'Bitte prüfe die Mikrofonberechtigung.';

        };

        recognition.onend = () => {

            if (status.textContent === 'ICH HÖRE ZU') {
                status.textContent = 'SYSTEM BEREIT';
            }

        };

        recognition.start();

    });


/* SPRACHAUSGABE STOPPEN */

document
    .getElementById('stoppButton')
    .addEventListener('click', () => {

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

    });

</script>

</body>
</html>
